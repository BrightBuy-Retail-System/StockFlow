name: Production CI/CD Pipeline (Railway & Frontend Verification)

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Frontend Build Verification (Validates React 19 + Vite SPA bundle)
  # =========================================================================
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend Production Artifacts
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # 2. Backend Syntax & Compilation Verification
  # =========================================================================
  backend-test:
    name: Backend Code Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Code Compilation
        run: |
          python -m compileall backend

  # =========================================================================
  # 3. Docker Container Build & Railway Automated Redeploy
  # =========================================================================
  build-and-deploy:
    name: Build Docker & Deploy to Railway
    needs: [frontend-build, backend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/stockflow-backend:latest

      - name: Install Railway CLI & Trigger Redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway redeploy --service 5037143c-2027-4c20-8153-57db693f4f8c --yes

